name: fir-r10-macos-sigstore
on:
  push:
    branches: [codex-fir-r10-sigstore-20261110-r2]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    env:
      FIR_R8_SIGSTORE_BUNDLE: ${{ github.workspace }}/evidence/fir-r10/sigstore/INDEPENDENT-REVIEW.sigstore.json
      FIR_R8_SIGSTORE_ARTIFACT: ${{ github.workspace }}/evidence/fir-r10/sigstore/INDEPENDENT-REVIEW.json
      FIR_R8_SIGSTORE_IDENTITY: https://github.com/limingkun626/docker_image_pusher/.github/workflows/sign.yml@refs/heads/codex-fir-r7-sign-20261110
      FIR_R8_SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r10/candidate/full-inspection-repair/requirements.txt
          python -m pip install "sigstore==4.5.1"
      - name: Prepare Sigstore verifier
        run: |
          printf '#!/usr/bin/env bash\nexec python -m sigstore "$@"\n' > "$RUNNER_TEMP/sigstore-verifier"
          chmod +x "$RUNNER_TEMP/sigstore-verifier"
      - name: Real offline Sigstore fixture
        working-directory: evidence/fir-r10/candidate/full-inspection-repair
        env:
          FIR_R8_SIGSTORE_VERIFIER: ${{ runner.temp }}/sigstore-verifier
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/integration/test_r8_release_sigstore.py::test_real_sigstore_verifier_offline_bundle
      - name: Full macOS tests
        working-directory: evidence/fir-r10/candidate/full-inspection-repair
        env:
          FIR_R8_SIGSTORE_VERIFIER: ${{ runner.temp }}/sigstore-verifier
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m pytest -q -rs -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest"
      - name: Product self-check
        working-directory: evidence/fir-r10/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target . --kind SKILL --output "$RUNNER_TEMP/self-check"
      - name: Package and install smoke
        working-directory: evidence/fir-r10/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/release_skill.py package --source . --output "$RUNNER_TEMP/package"
          python -B -m pytest -q -p no:cacheprovider \
            tests/integration/test_package_install.py \
            tests/integration/test_r8_release_contract.py \
            --junitxml "$RUNNER_TEMP/install-junit.xml" \
            --basetemp "$RUNNER_TEMP/install-pytest"
      - name: Preserve evidence
        run: |
          mkdir -p evidence/fir-r10/macos
          cp "$RUNNER_TEMP/macos-junit.xml" evidence/fir-r10/macos/macos-junit.xml
          cp "$RUNNER_TEMP/install-junit.xml" evidence/fir-r10/macos/install-junit.xml
          cp -R "$RUNNER_TEMP/self-check" evidence/fir-r10/macos/self-check
          cp -R "$RUNNER_TEMP/package" evidence/fir-r10/macos/package
          python - <<'PY'
          import hashlib, json, os, platform
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path("evidence/fir-r10/macos")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rows.append({
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })
          value = {
              "schema_version": 1,
              "status": "PASS",
              "provider": "github-actions",
              "candidate_digest": "af4ae4d47f62a8c4b9c78d20ed988e5953ae64546e4a6599fbc5b8710d3a2f5f",
              "completed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "junit_sha256": hashlib.sha256((root / "macos-junit.xml").read_bytes()).hexdigest(),
              "platform": "macos-15",
              "python": platform.python_version(),
              "machine": platform.machine(),
              "files": rows,
          }
          (root / "MACOS-EVIDENCE.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fir-r10-macos-evidence
          path: evidence/fir-r10/macos
          if-no-files-found: error
