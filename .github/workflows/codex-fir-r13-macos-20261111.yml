name: fir-r13-macos

on:
  push:
    branches: [codex-fir-r13-macos-20261111]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FIR_R8_SIGSTORE_BUNDLE: ${{ github.workspace }}/evidence/fir-r13/sigstore/INDEPENDENT-REVIEW.sigstore.json
      FIR_R8_SIGSTORE_ARTIFACT: ${{ github.workspace }}/evidence/fir-r13/sigstore/INDEPENDENT-REVIEW.json
      FIR_R8_SIGSTORE_IDENTITY: https://github.com/limingkun626/docker_image_pusher/.github/workflows/sign.yml@refs/heads/codex-fir-r7-sign-20261110
      FIR_R8_SIGSTORE_ISSUER: https://token.actions.githubusercontent.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r13/candidate/full-inspection-repair/requirements.txt
          python -m pip install "sigstore==4.5.1"

      - name: Verify candidate digest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B - <<'PY'
          import sys
          from pathlib import Path

          candidate = Path("evidence/fir-r13/candidate/full-inspection-repair")
          sys.path.insert(0, str(candidate / "scripts"))
          from full_inspection_repair.package import build_package_manifest

          actual = build_package_manifest(candidate)["tree_digest"]
          expected = "04e5d0fc2f1620833a9eb2b8611abf538b7807ae51831ffe3e9665083d818cd4"
          if actual != expected:
              raise SystemExit(f"candidate digest mismatch: {actual} != {expected}")
          print(f"candidate_digest={actual}")
          PY

      - name: Prepare Sigstore verifier
        run: |
          printf '#!/usr/bin/env bash\nexec python -m sigstore "$@"\n' > "$RUNNER_TEMP/sigstore-verifier"
          chmod +x "$RUNNER_TEMP/sigstore-verifier"

      - name: Full macOS tests
        working-directory: evidence/fir-r13/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FIR_R8_SIGSTORE_VERIFIER: ${{ runner.temp }}/sigstore-verifier
        run: |
          python -B -m pytest -q -rs -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest"

      - name: Product self-check
        working-directory: evidence/fir-r13/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target . --kind SKILL --output "$RUNNER_TEMP/self-check"

      - name: Package and install smoke
        working-directory: evidence/fir-r13/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/release_skill.py package --source . --output "$RUNNER_TEMP/package"
          python -B ../../make_r13_lifecycle_receipt.py \
            --candidate . \
            --manifest "$RUNNER_TEMP/package/package-manifest.json" \
            --platform macos \
            --output "$RUNNER_TEMP/macos-lifecycle"
          python -B -m pytest -q -p no:cacheprovider \
            tests/integration/test_package_install.py \
            tests/integration/test_r8_release_contract.py \
            --junitxml "$RUNNER_TEMP/install-junit.xml" \
            --basetemp "$RUNNER_TEMP/install-pytest"

      - name: Preserve evidence
        run: |
          mkdir -p evidence/fir-r13/macos
          cp "$RUNNER_TEMP/macos-junit.xml" evidence/fir-r13/macos/macos-junit.xml
          cp "$RUNNER_TEMP/install-junit.xml" evidence/fir-r13/macos/install-junit.xml
          cp -R "$RUNNER_TEMP/self-check" evidence/fir-r13/macos/self-check
          cp -R "$RUNNER_TEMP/package" evidence/fir-r13/macos/package
          cp "$RUNNER_TEMP/macos-lifecycle/macos-install.json" evidence/fir-r13/macos/macos-install.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path("evidence/fir-r13/macos")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rows.append({
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })
          value = {
              "schema_version": 1,
              "status": "PASS",
              "provider": "github-actions",
              "scope_id": "fir-full-r13-durability-20261111",
              "run_id": "fir-full-r13-durability-20261111-r1",
              "candidate_digest": "04e5d0fc2f1620833a9eb2b8611abf538b7807ae51831ffe3e9665083d818cd4",
              "completed_at": (
                  os.environ.get("GITHUB_RUN_STARTED_AT")
                  or datetime.now(UTC).replace(microsecond=0).isoformat()
              ),
              "junit_sha256": hashlib.sha256(
                  (root / "macos-junit.xml").read_bytes()
              ).hexdigest(),
              "install_junit_sha256": hashlib.sha256(
                  (root / "install-junit.xml").read_bytes()
              ).hexdigest(),
              "install_receipt_sha256": hashlib.sha256(
                  (root / "macos-install.json").read_bytes()
              ).hexdigest(),
              "platform": "macos-15",
              "python": platform.python_version(),
              "machine": platform.machine(),
              "files": rows,
          }
          (root / "MACOS-EVIDENCE.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fir-r13-macos-evidence
          path: evidence/fir-r13/macos
          if-no-files-found: error
