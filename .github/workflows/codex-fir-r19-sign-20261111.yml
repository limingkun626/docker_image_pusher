name: fir-1.7.0-release

on:
  push:
    branches: [codex-fir-r19-sign-20261111]
    paths:
      - evidence/fir-1.7.0/request.json
  workflow_dispatch:
    inputs:
      mode:
        description: "qualification records macOS and Linux evidence; full also finalizes and signs"
        required: false
        default: qualification
        type: choice
        options:
          - qualification
          - full

permissions:
  contents: write
  id-token: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-1.7.0/candidate/full-inspection-repair/requirements.txt

      - name: Install external fixture toolchain
        run: |
          bash evidence/fir-1.7.0/tools/install_platform_tools.sh macos

      - name: Probe macOS sandbox backend
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        run: |
          python -B - <<'PY'
          import json
          import sys

          sys.path.insert(0, "scripts")
          from full_inspection_repair.sandbox import (
              MacSandboxRuntimeBackend,
              SandboxLimits,
          )

          backend = MacSandboxRuntimeBackend(None)
          result = backend.run(
              [sys.executable, "-c", "print('sandbox probe')"],
              cwd=".",
              env=None,
              limits=SandboxLimits(),
              network_policy="ALLOW",
          )
          print(json.dumps(result.receipt(), indent=2, sort_keys=True))
          PY

      - name: Verify exact package
        run: |
          python -B evidence/fir-1.7.0/candidate/full-inspection-repair/scripts/release_skill.py package \
            --source evidence/fir-1.7.0/candidate/full-inspection-repair \
            --output "$RUNNER_TEMP/package"
          python -B - "$RUNNER_TEMP/package/package-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = json.loads(
              Path("evidence/fir-1.7.0/input/package-manifest.json").read_text()
          )
          actual = json.loads(Path(sys.argv[1]).read_text())
          if actual != expected:
              raise SystemExit("checkout package manifest differs from the freeze")
          sys.path.insert(
              0, "evidence/fir-1.7.0/candidate/full-inspection-repair/scripts"
          )
          from full_inspection_repair.package import verify_package_manifest

          verify_package_manifest(
              "evidence/fir-1.7.0/candidate/full-inspection-repair",
              expected,
          )
          PY

      - name: Full macOS tests
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -B -m pytest -q -rs --showlocals -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest" \
            2>&1 | tee "$RUNNER_TEMP/macos-pytest.log"

      - name: Clean-probe self-check
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target ../../probe-skill \
            --kind SKILL \
            --taxonomy ../../input/taxonomy-coverage.json \
            --output "$RUNNER_TEMP/self-check"

      - name: Lifecycle harness
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B ../../tools/lifecycle_harness_wrapper.py \
            --candidate . \
            --manifest ../../input/package-manifest.json \
            --platform macos \
            --output "$RUNNER_TEMP/macos-lifecycle"

      - name: Preserve macOS evidence
        if: always()
        run: |
          mkdir -p evidence/fir-1.7.0/macos
          for item in macos-junit.xml macos-pytest.log self-check macos-lifecycle; do
            if test -e "$RUNNER_TEMP/$item"; then
              cp -R "$RUNNER_TEMP/$item" evidence/fir-1.7.0/macos/
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fir-1.7.0-macos-evidence
          path: evidence/fir-1.7.0/macos
          if-no-files-found: error

  linux:
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-1.7.0/candidate/full-inspection-repair/requirements.txt

      - name: Install external fixture toolchain
        run: |
          bash evidence/fir-1.7.0/tools/install_platform_tools.sh linux

      - name: Verify exact package
        run: |
          python -B evidence/fir-1.7.0/candidate/full-inspection-repair/scripts/release_skill.py package \
            --source evidence/fir-1.7.0/candidate/full-inspection-repair \
            --output "$RUNNER_TEMP/package"
          python -B - "$RUNNER_TEMP/package/package-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = json.loads(
              Path("evidence/fir-1.7.0/input/package-manifest.json").read_text()
          )
          actual = json.loads(Path(sys.argv[1]).read_text())
          if actual != expected:
              raise SystemExit("checkout package manifest differs from the freeze")
          sys.path.insert(
              0, "evidence/fir-1.7.0/candidate/full-inspection-repair/scripts"
          )
          from full_inspection_repair.package import verify_package_manifest

          verify_package_manifest(
              "evidence/fir-1.7.0/candidate/full-inspection-repair",
              expected,
          )
          PY

      - name: Full Linux tests
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -B -m pytest -q -rs --showlocals -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/linux-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest" \
            2>&1 | tee "$RUNNER_TEMP/linux-pytest.log"

      - name: Linux clean-probe self-check
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target ../../probe-skill \
            --kind SKILL \
            --taxonomy ../../input/taxonomy-coverage.json \
            --output "$RUNNER_TEMP/linux-check"

      - name: Linux lifecycle harness
        working-directory: evidence/fir-1.7.0/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B ../../tools/lifecycle_harness_wrapper.py \
            --candidate . \
            --manifest ../../input/package-manifest.json \
            --platform linux \
            --output "$RUNNER_TEMP/linux-lifecycle"

      - name: Preserve Linux evidence
        if: always()
        run: |
          mkdir -p evidence/fir-1.7.0/linux
          for item in linux-junit.xml linux-pytest.log linux-check linux-lifecycle; do
            if test -e "$RUNNER_TEMP/$item"; then
              cp -R "$RUNNER_TEMP/$item" evidence/fir-1.7.0/linux/
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fir-1.7.0-linux-evidence
          path: evidence/fir-1.7.0/linux
          if-no-files-found: error

  preserve-platform-evidence:
    needs: [macos, linux]
    if: ${{ always() && (github.event_name == 'push' || inputs.mode == 'qualification') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fir-1.7.0-macos-evidence
          path: evidence/fir-1.7.0/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fir-1.7.0-linux-evidence
          path: evidence/fir-1.7.0/linux

      - name: Commit platform evidence
        run: |
          git config user.name "Codex FIR 1.7.0 Reviewer"
          git config user.email "codex-fir-1.7.0@users.noreply.github.com"
          git add evidence/fir-1.7.0/macos evidence/fir-1.7.0/linux
          if git diff --cached --quiet; then
            echo "platform evidence unchanged"
          else
            git commit -m "Record FIR 1.7.0 macOS and Linux qualification evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  finalize:
    needs: [macos, linux]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-1.7.0/candidate/full-inspection-repair/requirements.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fir-1.7.0-macos-evidence
          path: ${{ runner.temp }}/macos-evidence

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fir-1.7.0-linux-evidence
          path: ${{ runner.temp }}/linux-evidence

      - name: Stage platform evidence
        run: |
          mkdir -p evidence/fir-1.7.0/macos evidence/fir-1.7.0/linux
          cp -R "$RUNNER_TEMP/macos-evidence/." evidence/fir-1.7.0/macos/
          cp -R "$RUNNER_TEMP/linux-evidence/." evidence/fir-1.7.0/linux/

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Finalize and sign domain evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cp "$RUNNER_TEMP/linux-evidence/linux-junit.xml" evidence/fir-1.7.0/input/linux-junit.xml
          cp -R "$RUNNER_TEMP/linux-evidence/linux-lifecycle" evidence/fir-1.7.0/input/lifecycle-linux
          python -B evidence/fir-1.7.0/tools/finalize_release_1_7.py \
            --root evidence/fir-1.7.0 \
            --windows-check evidence/fir-1.7.0/input/windows-check \
            --linux-check "$RUNNER_TEMP/linux-evidence/linux-check" \
            --macos "$RUNNER_TEMP/macos-evidence" \
            --output evidence/fir-1.7.0/final

      - name: Sign reviewer attestation
        run: |
          mkdir -p evidence/fir-1.7.0/signed
          cosign sign-blob --yes \
            --bundle evidence/fir-1.7.0/signed/REVIEWER-ATTESTATION.sigstore.json \
            evidence/fir-1.7.0/final/reviewer-attestation.json
          cosign verify-blob \
            --bundle evidence/fir-1.7.0/signed/REVIEWER-ATTESTATION.sigstore.json \
            --certificate-identity \
              "https://github.com/limingkun626/docker_image_pusher/.github/workflows/codex-fir-r19-sign-20261111.yml@refs/heads/codex-fir-r19-sign-20261111" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            evidence/fir-1.7.0/final/reviewer-attestation.json

      - name: Verify final evidence
        run: |
          test -s evidence/fir-1.7.0/final/DOMAIN-SET.sigstore.json
          test -s evidence/fir-1.7.0/signed/REVIEWER-ATTESTATION.sigstore.json
          python -B - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path("evidence/fir-1.7.0/request.json").read_text())
          verification = json.loads(
              Path("evidence/fir-1.7.0/final/verification.json").read_text()
          )
          ledger = json.loads(
              Path("evidence/fir-1.7.0/final/risk-ledger.json").read_text()
          )
          gate = json.loads(
              Path("evidence/fir-1.7.0/final/risk-gate-evidence.json").read_text()
          )
          if request["candidate_digest"] != verification["candidate_digest"]:
              raise SystemExit("candidate digest drift")
          if verification["status"] != "PASS" or verification["failure_count"] != 0:
              raise SystemExit("verification is not PASS")
          if ledger["open_count"] != 0:
              raise SystemExit("risk ledger is open")
          if gate["status"] != "PASS" or gate["release_ready"] is not True:
              raise SystemExit("risk gate is not release-ready")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fir-1.7.0-release-evidence
          path: |
            evidence/fir-1.7.0/macos
            evidence/fir-1.7.0/final
            evidence/fir-1.7.0/signed
            evidence/fir-1.7.0/input/power
          if-no-files-found: error

      - name: Commit evidence and Sigstore bundles
        run: |
          git config user.name "Codex FIR 1.7.0 Reviewer"
          git config user.email "codex-fir-1.7.0@users.noreply.github.com"
          git add evidence/fir-1.7.0/macos evidence/fir-1.7.0/linux evidence/fir-1.7.0/final evidence/fir-1.7.0/signed
          if git diff --cached --quiet; then
            test -s evidence/fir-1.7.0/signed/REVIEWER-ATTESTATION.sigstore.json
          else
            git commit -m "Record FIR 1.7.0 macOS, final review, and Sigstore evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
