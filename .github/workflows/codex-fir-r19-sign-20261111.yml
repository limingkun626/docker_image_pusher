name: fir-r2-release-20261115

on:
  push:
    branches: [codex-fir-r19-sign-20261111]
    paths:
      - evidence/fir-r2/request.json

permissions:
  contents: write
  id-token: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r2/candidate/full-inspection-repair/requirements.txt

      - name: Verify exact package
        run: |
          python -B evidence/fir-r2/candidate/full-inspection-repair/scripts/release_skill.py package \
            --source evidence/fir-r2/candidate/full-inspection-repair \
            --output "$RUNNER_TEMP/package"
          python -B - "$RUNNER_TEMP/package/package-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = json.loads(
              Path("evidence/fir-r2/input/package-manifest.json").read_text()
          )
          actual = json.loads(
              Path(sys.argv[1]).read_text()
          )
          if actual != expected:
              raise SystemExit("checkout package manifest differs from the freeze")
          sys.path.insert(
              0, "evidence/fir-r2/candidate/full-inspection-repair/scripts"
          )
          from full_inspection_repair.package import verify_package_manifest

          verify_package_manifest(
              "evidence/fir-r2/candidate/full-inspection-repair",
              expected,
          )
          PY

      - name: Full macOS tests
        working-directory: evidence/fir-r2/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -B -m pytest -q -rs -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest" \
            2>&1 | tee "$RUNNER_TEMP/macos-pytest.log"

      - name: Candidate self-check
        working-directory: evidence/fir-r2/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target . \
            --kind SKILL \
            --taxonomy ../../input/taxonomy-coverage.json \
            --output "$RUNNER_TEMP/self-check" \
            2>&1 | tee "$RUNNER_TEMP/self-check.log"

      - name: Lifecycle harness
        working-directory: evidence/fir-r2/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B ../../tools/make_lifecycle_harness.py \
            --candidate . \
            --manifest ../../input/package-manifest.json \
            --platform macos \
            --output "$RUNNER_TEMP/macos-lifecycle"

      - name: Preserve macOS evidence
        if: always()
        run: |
          mkdir -p evidence/fir-r2/macos
          for item in macos-junit.xml macos-pytest.log self-check self-check.log macos-lifecycle; do
            if test -e "$RUNNER_TEMP/$item"; then
              cp -R "$RUNNER_TEMP/$item" evidence/fir-r2/macos/
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fir-r2-macos-evidence
          path: evidence/fir-r2/macos
          if-no-files-found: error

  finalize:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r2/candidate/full-inspection-repair/requirements.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fir-r2-macos-evidence
          path: evidence/fir-r2/macos

      - name: Fresh Linux self-check
        working-directory: evidence/fir-r2/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target . \
            --kind SKILL \
            --taxonomy ../../input/taxonomy-coverage.json \
            --output "$RUNNER_TEMP/linux-check"

      - name: Finalize evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B evidence/fir-r2/tools/finalize_release.py \
            --root evidence/fir-r2 \
            --windows-check evidence/fir-r2/input/windows-check \
            --linux-check "$RUNNER_TEMP/linux-check" \
            --macos evidence/fir-r2/macos \
            --output evidence/fir-r2/final

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Sign final evidence with GitHub OIDC
        run: |
          mkdir -p evidence/fir-r2/signed
          for name in PHYSICAL-POWER-EVIDENCE REVIEWER-ATTESTATION; do
            if test "$name" = "PHYSICAL-POWER-EVIDENCE"; then
              input="evidence/fir-r2/input/power/${name}.json"
            else
              input="evidence/fir-r2/final/reviewer-attestation.json"
            fi
            bundle="evidence/fir-r2/signed/${name}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$input"
          done

      - name: Verify final evidence before publication
        run: |
          test -s evidence/fir-r2/signed/PHYSICAL-POWER-EVIDENCE.sigstore.json
          test -s evidence/fir-r2/signed/REVIEWER-ATTESTATION.sigstore.json
          python -B - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path("evidence/fir-r2/request.json").read_text())
          verification = json.loads(
              Path("evidence/fir-r2/final/verification.json").read_text()
          )
          ledger = json.loads(Path("evidence/fir-r2/final/risk-ledger.json").read_text())
          if request["candidate_digest"] != verification["candidate_digest"]:
              raise SystemExit("candidate digest drift")
          if verification["status"] != "PASS" or verification["failure_count"] != 0:
              raise SystemExit("verification is not PASS")
          if ledger["open_count"] != 0:
              raise SystemExit("risk ledger is open")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fir-r2-release-evidence
          path: |
            evidence/fir-r2/macos
            evidence/fir-r2/final
            evidence/fir-r2/signed
          if-no-files-found: error

      - name: Commit evidence and Sigstore bundles
        run: |
          git config user.name "Codex FIR R2 Reviewer"
          git config user.email "codex-fir-r2-reviewer@users.noreply.github.com"
          git add evidence/fir-r2/macos evidence/fir-r2/final evidence/fir-r2/signed
          if git diff --cached --quiet; then
            test -s evidence/fir-r2/signed/REVIEWER-ATTESTATION.sigstore.json
          else
            git commit -m "Record FIR 1.6.0 macOS, final review, and Sigstore evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
