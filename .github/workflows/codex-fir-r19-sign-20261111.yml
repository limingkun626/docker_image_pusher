name: fir-r19-r20-r21-sigstore

on:
  push:
    branches: [codex-fir-r19-sign-20261111]
    paths:
      - evidence/fir-r19/sigstore/**
      - evidence/fir-r20/sigstore/**
      - evidence/fir-r21/sigstore/**

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Sign R19, R20, and R21 evidence files
        run: |
          roots=()
          for root in evidence/fir-r19/sigstore evidence/fir-r20/sigstore evidence/fir-r21/sigstore; do
            if test -d "$root"; then
              roots+=("$root")
            fi
          done
          test "${#roots[@]}" -gt 0
          count=0
          while IFS= read -r -d '' receipt; do
            count=$((count + 1))
            bundle="${receipt%.json}.sigstore.json"
            if test ! -s "$bundle"; then
              cosign sign-blob --yes --bundle "$bundle" "$receipt"
            fi
          done < <(
            find "${roots[@]}" -maxdepth 1 -type f -name '*.json' \
              ! -name '*.sigstore.json' -print0 | sort -z
          )
          test "$count" -gt 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fir-r19-r20-r21-sigstore-evidence
          path: |
            evidence/fir-r19/sigstore
            evidence/fir-r20/sigstore
            evidence/fir-r21/sigstore
          if-no-files-found: error

      - name: Commit signatures to branch
        run: |
          git config user.name "Codex R19 R20 R21 Sigstore"
          git config user.email "codex-r19-r20-r21-sigstore@users.noreply.github.com"
          for root in evidence/fir-r19/sigstore evidence/fir-r20/sigstore evidence/fir-r21/sigstore; do
            if test -d "$root"; then
              git add "$root"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record FIR R19, R20, and R21 Sigstore evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
