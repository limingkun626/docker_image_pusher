name: fir-r23-review-evidence

on:
  push:
    branches: [codex-fir-r23-evidence-20261112]
    paths:
      - evidence/fir-r23/sigstore/CANDIDATE-REVIEW.json

permissions:
  contents: read
  id-token: write

env:
  FIR_R23_SCOPE_ID: fir-full-r23-sigstore-authority-20261112
  FIR_R23_RUN_ID: fir-full-r23-sigstore-authority-20261112-r1
  FIR_R23_TRUST_CONFIG: evidence/fir-r23/trust/client-trust-config.json
  FIR_R23_REVIEWER_IDENTITY: https://github.com/limingkun626/docker_image_pusher/.github/workflows/codex-fir-r19-sign-20261111.yml@refs/heads/codex-fir-r19-sign-20261111
  FIR_R23_REVIEWER_ISSUER: https://token.actions.githubusercontent.com
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sign-review-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install frozen Sigstore verifier
        run: python -m pip install "sigstore==4.5.1"

      - name: Validate R23 identity and trust materials
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          evidence = Path("evidence")
          if {path.name for path in evidence.iterdir() if path.is_dir()} != {"fir-r23"}:
              raise SystemExit("publication tree contains non-R23 evidence")

          root = evidence / "fir-r23"
          candidate = root / "candidate" / "full-inspection-repair"
          sys.path.insert(0, str(candidate / "scripts"))
          from full_inspection_repair.package import build_package_manifest

          identity = json.loads((root / "CANDIDATE-IDENTITY.json").read_text(encoding="utf-8"))
          if (
              identity.get("scope_id") != os.environ["FIR_R23_SCOPE_ID"]
              or identity.get("run_id") != os.environ["FIR_R23_RUN_ID"]
              or identity.get("candidate_digest_is_release_authority") is not False
          ):
              raise SystemExit("R23 candidate identity mismatch")
          manifest = build_package_manifest(candidate)
          if (
              manifest["tree_digest"] != identity["candidate_digest"]
              or manifest["manifest_digest"] != identity["candidate_manifest_digest"]
          ):
              raise SystemExit("R23 candidate bytes drifted")

          required = json.loads((root / "REQUIRED-INPUTS.json").read_text(encoding="utf-8"))
          if (
              required.get("scope_id") != identity["scope_id"]
              or required.get("run_id") != identity["run_id"]
              or required.get("candidate_digest_is_release_authority") is not False
          ):
              raise SystemExit("R23 required-input contract mismatch")

          freeze_path = root / "CANDIDATE-FREEZE.json"
          review_path = root / "sigstore" / "CANDIDATE-REVIEW.json"
          if not freeze_path.is_file() or freeze_path.is_symlink():
              raise SystemExit("missing required R23 candidate freeze")
          if not review_path.is_file() or review_path.is_symlink():
              raise SystemExit("missing required R23 candidate review")
          freeze = json.loads(freeze_path.read_text(encoding="utf-8"))
          review = json.loads(review_path.read_text(encoding="utf-8"))
          for label, record in (("freeze", freeze), ("review", review)):
              if (
                  record.get("scope_id") != identity["scope_id"]
                  or record.get("run_id") != identity["run_id"]
                  or record.get("candidate_digest") != identity["candidate_digest"]
              ):
                  raise SystemExit(f"R23 {label} is not bound to the candidate identity")

          lock = json.loads((root / "trust" / "TRUST-MATERIALS-LOCK.json").read_text(encoding="utf-8"))
          if lock.get("scope_id") != identity["scope_id"]:
              raise SystemExit("trust lock belongs to another scope")
          checks = (
              ("client_trust_config", "client-trust-config.json"),
              ("trusted_root", "trusted-root.json"),
              ("signing_config", "signing-config.v0.2.json"),
          )
          for key, filename in checks:
              item = lock["sigstore"][key]
              path = root / "trust" / filename
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != item["sha256"]:
                  raise SystemExit(f"{key} digest mismatch")
          config = json.loads((root / "trust" / "client-trust-config.json").read_text(encoding="utf-8"))
          if (
              config.get("mediaType") != "application/vnd.dev.sigstore.clienttrustconfig.v0.1+json"
              or config.get("trustedRoot", {}).get("mediaType")
              != "application/vnd.dev.sigstore.trustedroot+json;version=0.1"
              or config.get("signingConfig", {}).get("mediaType")
              != "application/vnd.dev.sigstore.signingconfig.v0.2+json"
          ):
              raise SystemExit("ClientTrustConfig media type mismatch")
          print(json.dumps({"status": "PASS", "scope_id": identity["scope_id"]}, sort_keys=True))
          PY

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Sign candidate review evidence
        run: |
          cosign sign-blob --yes \
            --bundle evidence/fir-r23/sigstore/CANDIDATE-REVIEW.sigstore.json \
            evidence/fir-r23/sigstore/CANDIDATE-REVIEW.json

      - name: Verify signed review evidence
        run: |
          sigstore --trust-config "$FIR_R23_TRUST_CONFIG" verify identity --offline \
            --bundle evidence/fir-r23/sigstore/CANDIDATE-REVIEW.sigstore.json \
            --cert-identity "$FIR_R23_REVIEWER_IDENTITY" \
            --cert-oidc-issuer "$FIR_R23_REVIEWER_ISSUER" \
            evidence/fir-r23/sigstore/CANDIDATE-REVIEW.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fir-r23-candidate-review-signed
          path: |
            evidence/fir-r23/sigstore/CANDIDATE-REVIEW.json
            evidence/fir-r23/sigstore/CANDIDATE-REVIEW.sigstore.json
          if-no-files-found: error
