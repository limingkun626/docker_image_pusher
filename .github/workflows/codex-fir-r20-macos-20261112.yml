name: fir-r20-macos

on:
  push:
    branches:
      - codex-fir-r20-macos-20261112
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FIR_R20_SCOPE_ID: fir-full-r20-r19-probe-refreeze-20261112
      FIR_R20_RUN_ID: fir-full-r20-r19-probe-refreeze-20261112-r1
      FIR_R20_CANDIDATE_DIGEST: 0d364d7963f0555b88a8e71b2cb4b9ef5ef05a6da1b99aaf52c3dcfec3038955
      FIR_R20_EVIDENCE_BRANCH: codex-fir-r20-macos-20261112
      FIR_R8_SIGSTORE_BUNDLE: ${{ github.workspace }}/evidence/fir-r20/fixture/INDEPENDENT-REVIEW.sigstore.json
      FIR_R8_SIGSTORE_ARTIFACT: ${{ github.workspace }}/evidence/fir-r20/fixture/INDEPENDENT-REVIEW.json
      FIR_R8_SIGSTORE_IDENTITY: https://github.com/limingkun626/docker_image_pusher/.github/workflows/sign.yml@refs/heads/codex-fir-r7-sign-20261110
      FIR_R8_SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r20/candidate/full-inspection-repair/requirements.txt
          python -m pip install "sigstore==4.5.1"

      - name: Verify R20 identity
        run: |
          test "$FIR_R20_SCOPE_ID" = "fir-full-r20-r19-probe-refreeze-20261112"
          test "$FIR_R20_RUN_ID" = "fir-full-r20-r19-probe-refreeze-20261112-r1"
          test "$FIR_R20_CANDIDATE_DIGEST" = "0d364d7963f0555b88a8e71b2cb4b9ef5ef05a6da1b99aaf52c3dcfec3038955"
          test "$GITHUB_REF_NAME" = "$FIR_R20_EVIDENCE_BRANCH"
          python -B - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          evidence = Path("evidence/fir-r20")
          candidate = evidence / "candidate" / "full-inspection-repair"
          sys.path.insert(0, str(candidate / "scripts"))
          from full_inspection_repair.package import build_package_manifest

          manifest = build_package_manifest(candidate)
          identity = json.loads((evidence / "CANDIDATE-IDENTITY.json").read_text(encoding="utf-8"))
          policy = json.loads(
              (candidate / "policies" / "trust-policy.json").read_text(encoding="utf-8")
          )
          expected_reviewer = (
              "https://github.com/limingkun626/docker_image_pusher/"
              ".github/workflows/codex-fir-r19-sign-20261111.yml"
              "@refs/heads/codex-fir-r19-sign-20261111"
          )
          reviewers = [
              item["reviewer"]
              for item in policy["reviewers"]
              if item.get("status") == "ACTIVE"
          ]
          checks = {
              "candidate_digest": manifest["tree_digest"],
              "candidate_manifest_digest": manifest["manifest_digest"],
              "identity_candidate_digest": identity["candidate_digest"],
              "scope_id": identity["scope_id"],
              "run_id": identity["run_id"],
              "reviewer": reviewers,
          }
          expected = {
              "candidate_digest": os.environ["FIR_R20_CANDIDATE_DIGEST"],
              "candidate_manifest_digest": "cafafe4a3f7884d94330f89b3caeb75cb3b753610fe7940a23f9fa9f83e25c65",
              "identity_candidate_digest": os.environ["FIR_R20_CANDIDATE_DIGEST"],
              "scope_id": os.environ["FIR_R20_SCOPE_ID"],
              "run_id": os.environ["FIR_R20_RUN_ID"],
              "reviewer": [expected_reviewer],
          }
          if checks != expected:
              raise SystemExit(f"R20 identity mismatch: {checks!r} != {expected!r}")
          print(json.dumps(checks, sort_keys=True))
          PY

      - name: Prepare Sigstore test verifier
        run: |
          printf '#!/usr/bin/env bash\nexec python -m sigstore "$@"\n' > "$RUNNER_TEMP/sigstore-verifier"
          chmod +x "$RUNNER_TEMP/sigstore-verifier"

      - name: Diagnose repair CLI
        working-directory: evidence/fir-r20/candidate/full-inspection-repair
        run: |
          python -B - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from full_inspection_repair.cli import main
          from full_inspection_repair.detector_registry import default_taxonomy_coverage

          with tempfile.TemporaryDirectory(prefix="r20-repair-diag-") as raw:
              root = Path(raw)
              source = root / "source-skill"
              source.mkdir()
              (source / "SKILL.md").write_text(
                  "---\nname: source-skill\n---\n\n# Demo",
                  encoding="utf-8",
              )
              output = root / "repair-run"
              candidate = root / "candidate" / "source-skill"
              taxonomy = root / "taxonomy.json"
              taxonomy.write_text(
                  json.dumps(default_taxonomy_coverage("SKILL")),
                  encoding="utf-8",
              )
              result = main([
                  "repair",
                  "--target",
                  str(source),
                  "--kind",
                  "SKILL",
                  "--output",
                  str(output),
                  "--candidate",
                  str(candidate),
                  "--taxonomy",
                  str(taxonomy),
              ])
              print(f"repair_exit={result}")
              for path in sorted(output.rglob("*")) if output.exists() else []:
                  if path.is_file():
                      print(f"ARTIFACT {path.relative_to(output)}")
                      if path.stat().st_size <= 65536:
                          print(path.read_text(encoding="utf-8", errors="replace"))
          PY

      - name: Full macOS tests
        working-directory: evidence/fir-r20/candidate/full-inspection-repair
        env:
          FIR_R8_SIGSTORE_VERIFIER: ${{ runner.temp }}/sigstore-verifier
        run: |
          set -o pipefail
          python -B -m pytest -q -rs -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest" \
            2>&1 | tee "$RUNNER_TEMP/macos-pytest.log"

      - name: Product self-check
        working-directory: evidence/fir-r20/candidate/full-inspection-repair
        run: |
          python -B scripts/run_inspection.py check \
            --target . --kind SKILL --output "$RUNNER_TEMP/self-check" \
            2>&1 | tee "$RUNNER_TEMP/self-check.log"

      - name: Package and install smoke
        working-directory: evidence/fir-r20/candidate/full-inspection-repair
        run: |
          set -o pipefail
          python -B scripts/release_skill.py package \
            --source . --output "$RUNNER_TEMP/package"
          python -B ../../make_r20_lifecycle_receipt.py \
            --candidate . \
            --manifest "$RUNNER_TEMP/package/package-manifest.json" \
            --platform macos \
            --output "$RUNNER_TEMP/macos-lifecycle"
          python -B -m pytest -q -p no:cacheprovider \
            tests/integration/test_package_install.py \
            tests/integration/test_r8_release_contract.py \
            --junitxml "$RUNNER_TEMP/install-junit.xml" \
            --basetemp "$RUNNER_TEMP/install-pytest" \
            2>&1 | tee "$RUNNER_TEMP/install-pytest.log"

      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p evidence/fir-r20/macos
          for item in macos-junit.xml macos-pytest.log install-junit.xml install-pytest.log self-check self-check.log package macos-lifecycle; do
            if [ -e "$RUNNER_TEMP/$item" ]; then
              cp -R "$RUNNER_TEMP/$item" evidence/fir-r20/macos/
            fi
          done
          python -B - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root = Path("evidence/fir-r20/macos")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rows.append({
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })
          junit = root / "macos-junit.xml"
          totals = None
          if junit.is_file():
              tree = ET.parse(junit)
              suites = [tree.getroot()] if tree.getroot().tag == "testsuite" else list(tree.getroot())
              totals = {
                  "tests": sum(int(suite.attrib.get("tests", "0")) for suite in suites),
                  "failures": sum(int(suite.attrib.get("failures", "0")) for suite in suites),
                  "errors": sum(int(suite.attrib.get("errors", "0")) for suite in suites),
                  "skipped": sum(int(suite.attrib.get("skipped", "0")) for suite in suites),
              }
          install_junit = root / "install-junit.xml"
          install_receipt = root / "macos-lifecycle" / "macos-install.json"
          value = {
              "schema_version": 1,
              "status": "PASS_ONLY_IF_REQUIRED_FILES_AND_COUNTS_VALIDATE",
              "provider": "github-actions",
              "scope_id": os.environ["FIR_R20_SCOPE_ID"],
              "run_id": os.environ["FIR_R20_RUN_ID"],
              "candidate_digest": os.environ["FIR_R20_CANDIDATE_DIGEST"],
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
              "completed_at": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "junit_sha256": hashlib.sha256(junit.read_bytes()).hexdigest() if junit.is_file() else None,
              "junit_totals": totals,
              "install_junit_sha256": hashlib.sha256(install_junit.read_bytes()).hexdigest() if install_junit.is_file() else None,
              "install_receipt_sha256": hashlib.sha256(install_receipt.read_bytes()).hexdigest() if install_receipt.is_file() else None,
              "platform": "macos-15",
              "python": platform.python_version(),
              "machine": platform.machine(),
              "files": rows,
          }
          (root / "MACOS-EVIDENCE.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fir-r20-macos-evidence
          path: evidence/fir-r20/macos
          if-no-files-found: warn

      - name: Commit evidence to R20 branch
        if: success()
        run: |
          git config user.name "Codex R20 Evidence"
          git config user.email "codex-r20-evidence@users.noreply.github.com"
          git add evidence/fir-r20/macos
          if ! git diff --cached --quiet; then
            git commit -m "Record FIR R20 macOS evidence [skip ci]"
            git push origin "HEAD:${FIR_R20_EVIDENCE_BRANCH}"
          fi
