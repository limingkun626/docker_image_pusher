name: fir-r19-macos

on:
  push:
    branches:
      - codex-fir-r19-macos-qualification-20261111
      - codex-fir-r19-macos-qualification2-20261111
      - codex-fir-r19-macos-formal-20261111
  workflow_dispatch:
    inputs:
      phase:
        description: Qualification or formal R19 matrix evidence
        required: true
        type: choice
        options:
          - qualification
          - formal
      candidate_digest:
        description: Exact frozen or qualification candidate digest
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FIR_R19_PHASE: ${{ inputs.phase || (contains(github.ref_name, 'qualification') && 'qualification' || 'formal') }}
      FIR_R19_CANDIDATE_DIGEST: ${{ inputs.candidate_digest || '0d364d7963f0555b88a8e71b2cb4b9ef5ef05a6da1b99aaf52c3dcfec3038955' }}
      FIR_R8_SIGSTORE_BUNDLE: ${{ github.workspace }}/evidence/fir-r19/fixture/INDEPENDENT-REVIEW.sigstore.json
      FIR_R8_SIGSTORE_ARTIFACT: ${{ github.workspace }}/evidence/fir-r19/fixture/INDEPENDENT-REVIEW.json
      FIR_R8_SIGSTORE_IDENTITY: https://github.com/limingkun626/docker_image_pusher/.github/workflows/sign.yml@refs/heads/codex-fir-r7-sign-20261110
      FIR_R8_SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r19/candidate/full-inspection-repair/requirements.txt
          python -m pip install "sigstore==4.5.1"

      - name: Verify candidate identity
        run: |
          python -B - <<'PY'
          import os
          import sys
          from pathlib import Path

          candidate = Path("evidence/fir-r19/candidate/full-inspection-repair")
          sys.path.insert(0, str(candidate / "scripts"))
          from full_inspection_repair.package import build_package_manifest

          actual = build_package_manifest(candidate)["tree_digest"]
          expected = os.environ["FIR_R19_CANDIDATE_DIGEST"]
          if actual != expected:
              raise SystemExit(f"candidate digest mismatch: {actual} != {expected}")
          print(f"candidate_digest={actual}")
          PY

      - name: Prepare Sigstore test verifier
        run: |
          printf '#!/usr/bin/env bash\nexec python -m sigstore "$@"\n' > "$RUNNER_TEMP/sigstore-verifier"
          chmod +x "$RUNNER_TEMP/sigstore-verifier"

      - name: Full macOS tests
        working-directory: evidence/fir-r19/candidate/full-inspection-repair
        env:
          FIR_R8_SIGSTORE_VERIFIER: ${{ runner.temp }}/sigstore-verifier
        run: |
          set -o pipefail
          python -B -m pytest -q -rs -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest" \
            2>&1 | tee "$RUNNER_TEMP/macos-pytest.log"

      - name: Product self-check
        working-directory: evidence/fir-r19/candidate/full-inspection-repair
        run: |
          python -B scripts/run_inspection.py check \
            --target . --kind SKILL --output "$RUNNER_TEMP/self-check" \
            2>&1 | tee "$RUNNER_TEMP/self-check.log"

      - name: Package and install smoke
        working-directory: evidence/fir-r19/candidate/full-inspection-repair
        run: |
          set -o pipefail
          python -B scripts/release_skill.py package \
            --source . --output "$RUNNER_TEMP/package"
          python -B ../../make_r19_lifecycle_receipt.py \
            --candidate . \
            --manifest "$RUNNER_TEMP/package/package-manifest.json" \
            --platform macos \
            --output "$RUNNER_TEMP/macos-lifecycle"
          python -B -m pytest -q -p no:cacheprovider \
            tests/integration/test_package_install.py \
            tests/integration/test_r8_release_contract.py \
            --junitxml "$RUNNER_TEMP/install-junit.xml" \
            --basetemp "$RUNNER_TEMP/install-pytest" \
            2>&1 | tee "$RUNNER_TEMP/install-pytest.log"

      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p evidence/fir-r19/macos
          for item in macos-junit.xml macos-pytest.log install-junit.xml install-pytest.log self-check self-check.log package macos-lifecycle; do
            if [ -e "$RUNNER_TEMP/$item" ]; then
              cp -R "$RUNNER_TEMP/$item" evidence/fir-r19/macos/
            fi
          done
          python -B - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from collections import Counter
          from datetime import UTC, datetime
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root = Path("evidence/fir-r19/macos")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rows.append({
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })
          junit = root / "macos-junit.xml"
          totals = None
          if junit.is_file():
              tree = ET.parse(junit)
              suites = [tree.getroot()] if tree.getroot().tag == "testsuite" else list(tree.getroot())
              totals = {
                  "tests": sum(int(suite.attrib.get("tests", "0")) for suite in suites),
                  "failures": sum(int(suite.attrib.get("failures", "0")) for suite in suites),
                  "errors": sum(int(suite.attrib.get("errors", "0")) for suite in suites),
                  "skipped": sum(int(suite.attrib.get("skipped", "0")) for suite in suites),
              }
          install_junit = root / "install-junit.xml"
          install_receipt = root / "macos-lifecycle" / "macos-install.json"
          value = {
              "schema_version": 1,
              "status": "PASS_ONLY_IF_REQUIRED_FILES_AND_COUNTS_VALIDATE",
              "provider": "github-actions",
              "phase": os.environ["FIR_R19_PHASE"],
              "scope_id": "fir-full-r19-review-defect-repair-20261111",
              "run_id": "fir-full-r19-review-defect-repair-20261111-r1",
              "candidate_digest": os.environ["FIR_R19_CANDIDATE_DIGEST"],
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
              "completed_at": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "junit_sha256": hashlib.sha256(junit.read_bytes()).hexdigest() if junit.is_file() else None,
              "junit_totals": totals,
              "install_junit_sha256": hashlib.sha256(install_junit.read_bytes()).hexdigest() if install_junit.is_file() else None,
              "install_receipt_sha256": hashlib.sha256(install_receipt.read_bytes()).hexdigest() if install_receipt.is_file() else None,
              "platform": "macos-15",
              "python": platform.python_version(),
              "machine": platform.machine(),
              "files": rows,
          }
          (root / "MACOS-EVIDENCE.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fir-r19-macos-evidence
          path: evidence/fir-r19/macos
          if-no-files-found: warn

      - name: Commit evidence to branch
        if: success()
        run: |
          git config user.name "Codex R19 Evidence"
          git config user.email "codex-r19-evidence@users.noreply.github.com"
          git add evidence/fir-r19/macos
          git commit -m "Record FIR R19 macOS evidence [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
