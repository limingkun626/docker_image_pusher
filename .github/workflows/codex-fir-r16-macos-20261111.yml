name: fir-r16-macos

on:
  push:
    branches: [codex-fir-r16-macos-20261111]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FIR_R8_SIGSTORE_BUNDLE: ${{ github.workspace }}/evidence/fir-r16/sigstore/INDEPENDENT-REVIEW.sigstore.json
      FIR_R8_SIGSTORE_ARTIFACT: ${{ github.workspace }}/evidence/fir-r16/sigstore/INDEPENDENT-REVIEW.json
      FIR_R8_SIGSTORE_IDENTITY: https://github.com/limingkun626/docker_image_pusher/.github/workflows/sign.yml@refs/heads/codex-fir-r7-sign-20261110
      FIR_R8_SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
      FIR_R8_SIGSTORE_FIXTURE_LABEL: library-test-fixture-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r evidence/fir-r16/candidate/full-inspection-repair/requirements.txt
          python -m pip install "sigstore==4.5.1"

      - name: Verify R16 candidate digest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B - <<'PY'
          import sys
          from pathlib import Path

          candidate = Path("evidence/fir-r16/candidate/full-inspection-repair")
          sys.path.insert(0, str(candidate / "scripts"))
          from full_inspection_repair.package import build_package_manifest

          actual = build_package_manifest(candidate)["tree_digest"]
          expected = "1fd66cdf76cc4477250ad53faf6e3363de0ef2122729a191d4714ba5ccfb2d35"
          if actual != expected:
              raise SystemExit(f"candidate digest mismatch: {actual} != {expected}")
          print(f"candidate_digest={actual}")
          PY

      - name: Prepare Sigstore test verifier
        run: |
          printf '#!/usr/bin/env bash\nexec python -m sigstore "$@"\n' > "$RUNNER_TEMP/sigstore-verifier"
          chmod +x "$RUNNER_TEMP/sigstore-verifier"

      - name: Verify matching R7 pair and negative control
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B evidence/fir-r16/r16_negative_mutation.py \
            --candidate evidence/fir-r16/candidate/full-inspection-repair \
            --workflow .github/workflows/codex-fir-r16-macos-20261111.yml \
            --bundle "$FIR_R8_SIGSTORE_BUNDLE" \
            --artifact "$FIR_R8_SIGSTORE_ARTIFACT" \
            --wrong-artifact evidence/fir-r13/sigstore/INDEPENDENT-REVIEW.json \
            --verifier "$RUNNER_TEMP/sigstore-verifier" \
            --output "$RUNNER_TEMP/mutation" \
            | tee "$RUNNER_TEMP/mutation.log"

      - name: Full macOS suite
        working-directory: evidence/fir-r16/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FIR_R8_SIGSTORE_VERIFIER: ${{ runner.temp }}/sigstore-verifier
        run: |
          set -o pipefail
          python -B -m pytest -q -rs -p no:cacheprovider . \
            --junitxml "$RUNNER_TEMP/macos-junit.xml" \
            --basetemp "$RUNNER_TEMP/pytest" \
            2>&1 | tee "$RUNNER_TEMP/macos-pytest.log"

      - name: Native 100-trial lock stress
        working-directory: evidence/fir-r16/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -B -m pytest -q -rs -p no:cacheprovider \
            tests/integration/test_r14_macos_observation_lock_stress.py \
            --junitxml "$RUNNER_TEMP/native-stress-junit.xml" \
            --basetemp "$RUNNER_TEMP/native-stress-pytest" \
            2>&1 | tee "$RUNNER_TEMP/native-stress.log"

      - name: Product self-check
        working-directory: evidence/fir-r16/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B scripts/run_inspection.py check \
            --target . --kind SKILL --output "$RUNNER_TEMP/self-check" \
            2>&1 | tee "$RUNNER_TEMP/self-check.log"

      - name: Package and install lifecycle
        working-directory: evidence/fir-r16/candidate/full-inspection-repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -B scripts/release_skill.py package --source . --output "$RUNNER_TEMP/package"
          python -B ../../make_r16_lifecycle_receipt.py \
            --candidate . \
            --manifest "$RUNNER_TEMP/package/package-manifest.json" \
            --platform macos \
            --output "$RUNNER_TEMP/macos-lifecycle"
          python -B -m pytest -q -p no:cacheprovider \
            tests/integration/test_package_install.py \
            tests/integration/test_r8_release_contract.py \
            --junitxml "$RUNNER_TEMP/install-junit.xml" \
            --basetemp "$RUNNER_TEMP/install-pytest" \
            2>&1 | tee "$RUNNER_TEMP/install-pytest.log"

      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p evidence/fir-r16/macos
          for item in macos-junit.xml macos-pytest.log native-stress-junit.xml native-stress.log mutation mutation.log install-junit.xml install-pytest.log self-check self-check.log package macos-lifecycle; do
            if [ -e "$RUNNER_TEMP/$item" ]; then
              cp -R "$RUNNER_TEMP/$item" evidence/fir-r16/macos/
            fi
          done
          if [ -d "$RUNNER_TEMP/pytest" ]; then
            cp -R "$RUNNER_TEMP/pytest" evidence/fir-r16/macos/pytest
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path("evidence/fir-r16/macos")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rows.append({
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })
          junit = root / "macos-junit.xml"
          native_junit = root / "native-stress-junit.xml"
          install_junit = root / "install-junit.xml"
          install_receipt = root / "macos-lifecycle" / "macos-install.json"
          mutation = root / "mutation" / "mutation-result.json"
          fixture_artifact = Path("evidence/fir-r16/sigstore/INDEPENDENT-REVIEW.json")
          fixture_bundle = Path("evidence/fir-r16/sigstore/INDEPENDENT-REVIEW.sigstore.json")
          value = {
              "schema_version": 1,
              "status": "CAPTURED",
              "provider": "github-actions",
              "scope_id": "fir-full-r16-sigstore-r7-pair-20261111",
              "run_id": "fir-full-r16-sigstore-r7-pair-20261111-r1",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow": ".github/workflows/codex-fir-r16-macos-20261111.yml",
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "artifact_name": "fir-r16-macos-evidence",
              "candidate_digest": "1fd66cdf76cc4477250ad53faf6e3363de0ef2122729a191d4714ba5ccfb2d35",
              "fixture_identity": "https://github.com/limingkun626/docker_image_pusher/.github/workflows/sign.yml@refs/heads/codex-fir-r7-sign-20261110",
              "fixture_label": "library-test-fixture-only",
              "fixture_artifact_sha256": hashlib.sha256(fixture_artifact.read_bytes()).hexdigest(),
              "fixture_bundle_sha256": hashlib.sha256(fixture_bundle.read_bytes()).hexdigest(),
              "completed_at": os.environ.get("GITHUB_RUN_STARTED_AT") or datetime.now(UTC).replace(microsecond=0).isoformat(),
              "junit_sha256": hashlib.sha256(junit.read_bytes()).hexdigest() if junit.is_file() else None,
              "native_stress_junit_sha256": hashlib.sha256(native_junit.read_bytes()).hexdigest() if native_junit.is_file() else None,
              "install_junit_sha256": hashlib.sha256(install_junit.read_bytes()).hexdigest() if install_junit.is_file() else None,
              "install_receipt_sha256": hashlib.sha256(install_receipt.read_bytes()).hexdigest() if install_receipt.is_file() else None,
              "mutation_result_sha256": hashlib.sha256(mutation.read_bytes()).hexdigest() if mutation.is_file() else None,
              "platform": "macos-15",
              "python": platform.python_version(),
              "machine": platform.machine(),
              "files": rows,
          }
          (root / "MACOS-EVIDENCE.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fir-r16-macos-evidence
          path: evidence/fir-r16/macos
          if-no-files-found: warn
