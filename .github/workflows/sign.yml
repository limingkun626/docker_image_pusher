name: fir-r7-sigstore
on:
  push:
    branches: [codex-fir-r7-sign-20261110]
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Sign frozen review
        run: cosign sign-blob --yes --bundle signature.sigstore.json evidence/INDEPENDENT-REVIEW.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sigstore-bundle
          path: signature.sigstore.json
          if-no-files-found: error
